<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber World Map</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #020605;
            font-family: monospace;
            color: #00ff88;
        }

        .screen {
            position: relative;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 50% 50%,
                    rgba(0, 255, 120, 0.08),
                    transparent 55%),
                #020605;
        }

        .title {
            position: absolute;
            top: 25px;
            left: 35px;
            font-size: 18px;
            letter-spacing: 4px;
            text-shadow: 0 0 10px #00ff88;
        }

        .status {
            position: absolute;
            top: 28px;
            right: 35px;
            font-size: 13px;
            color: #ff3030;
            text-shadow: 0 0 8px red;
        }

        .map {
            position: absolute;
            left: 5%;
            right: 5%;
            top: 12%;
            bottom: 12%;
            opacity: 0.9;
        }

        .map svg {
            width: 100%;
            height: 100%;
        }

        .grid {
            position: absolute;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(0, 255, 120, 0.04) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(0, 255, 120, 0.04) 1px,
                    transparent 1px
                );

            background-size: 35px 35px;

            pointer-events: none;
        }

        .scan {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: #00ff88;
            box-shadow: 0 0 15px #00ff88;
            opacity: 0.25;

            animation: scan 5s linear infinite;
        }

        @keyframes scan {
            from {
                top: 0;
            }

            to {
                top: 100%;
            }
        }

        .location {
            position: absolute;
            width: 7px;
            height: 7px;
            background: #ff3030;
            border-radius: 50%;
            box-shadow:
                0 0 8px red,
                0 0 20px red;

            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.8);
                opacity: 0.4;
            }
        }

        .bottom {
            position: absolute;
            bottom: 25px;
            left: 35px;
            right: 35px;

            display: flex;
            justify-content: space-between;

            font-size: 11px;
            opacity: 0.7;
            letter-spacing: 2px;
        }

        .coordinates {
            color: #00ff88;
        }
    </style>
</head>

<body>

<div class="screen">

    <div class="title">
        GLOBAL NETWORK // 01
    </div>

    <div class="status">
        ● SYSTEM ONLINE
    </div>

    <div class="map">

        <!-- نقشه ساده قاره‌ها -->
        <svg viewBox="0 0 1000 500"
             xmlns="http://www.w3.org/2000/svg">

            <g fill="#063d2c"
               stroke="#00ff88"
               stroke-width="1.5"
               opacity="0.9">

                <!-- North America -->
                <path d="
                M80 130
                L130 80
                L210 70
                L260 110
                L230 160
                L180 170
                L150 220
                L110 200
                L100 160
                Z"/>

                <!-- South America -->
                <path d="
                M260 240
                L310 260
                L330 320
                L300 390
                L270 430
                L250 370
                L260 320
                L240 280
                Z"/>

                <!-- Europe -->
                <path d="
                M470 115
                L510 90
                L560 105
                L575 135
                L540 155
                L490 150
                Z"/>

                <!-- Asia -->
                <path d="
                M550 120
                L630 90
                L740 110
                L830 150
                L850 210
                L770 230
                L690 210
                L620 180
                L560 165
                Z"/>

                <!-- Africa -->
                <path d="
                M500 190
                L570 180
                L620 230
                L600 310
                L550 360
                L510 320
                L490 260
                Z"/>

                <!-- Australia -->
                <path d="
                M760 330
                L830 310
                L880 340
                L870 390
                L800 410
                L750 380
                Z"/>

            </g>

            <!-- خطوط شبکه -->
            <g
                stroke="#00ff88"
                stroke-width="0.5"
                opacity="0.25">

                <line x1="0" y1="100" x2="1000" y2="100"/>
                <line x1="0" y1="200" x2="1000" y2="200"/>
                <line x1="0" y1="300" x2="1000" y2="300"/>
                <line x1="0" y1="400" x2="1000" y2="400"/>

                <line x1="100" y1="0" x2="100" y2="500"/>
                <line x1="200" y1="0" x2="200" y2="500"/>
                <line x1="300" y1="0" x2="300" y2="500"/>
                <line x1="400" y1="0" x2="400" y2="500"/>
                <line x1="500" y1="0" x2="500" y2="500"/>
                <line x1="600" y1="0" x2="600" y2="500"/>
                <line x1="700" y1="0" x2="700" y2="500"/>
                <line x1="800" y1="0" x2="800" y2="500"/>
                <line x1="900" y1="0" x2="900" y2="500"/>

            </g>

        </svg>

    </div>

    <!-- نقاط قرمز روی نقشه -->
    <div class="location" style="left: 27%; top: 42%;"></div>
    <div class="location" style="left: 50%; top: 38%;"></div>
    <div class="location" style="left: 67%; top: 43%;"></div>
    <div class="location" style="left: 76%; top: 55%;"></div>
    <div class="location" style="left: 54%; top: 60%;"></div>

    <div class="grid"></div>
    <div class="scan"></div>

    <div class="bottom">
        <span>NETWORK: SECURE</span>
        <span class="coordinates">
            LAT 40.7128° // LON 74.0060°
        </span>
        <span>PACKETS: 184,293</span>
    </div>

</div>

</body>
</html>
